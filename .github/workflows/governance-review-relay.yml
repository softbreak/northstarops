name: Governance Review Relay

on:
  workflow_run:
    workflows:
      - Governance Relay
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: governance-review-relay-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  relay-review:
    if: >-
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Download captured review payload
        uses: actions/download-artifact@v4
        with:
          name: governance-review-payload
          path: relay-payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate captured event and dispatch privately
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_DISPATCH_TOKEN }}
          PUBLIC_GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_REPO: ${{ github.repository }}
          EXPECTED_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PAYLOAD_FILE: relay-payload/review-payload.json
        run: |
          set -euo pipefail

          [ -f "${PAYLOAD_FILE}" ] || { echo "FAIL_CLOSED: review payload artifact missing"; exit 1; }
          [ -n "${GH_TOKEN:-}" ] || { echo "FAIL_CLOSED: governance dispatch token unavailable"; exit 1; }

          SOURCE_REPO="$(jq -er '.source_repo' "${PAYLOAD_FILE}")"
          SOURCE_EVENT="$(jq -er '.source_event' "${PAYLOAD_FILE}")"
          SOURCE_ACTION="$(jq -er '.source_action' "${PAYLOAD_FILE}")"
          PR_NUMBER="$(jq -er '.pr_number' "${PAYLOAD_FILE}")"
          REVIEW_ID="$(jq -er '.review_id' "${PAYLOAD_FILE}")"
          ACTOR="$(jq -er '.actor' "${PAYLOAD_FILE}")"
          SOURCE_RUN_ID="$(jq -er '.source_run_id' "${PAYLOAD_FILE}")"

          if [ "${SOURCE_REPO}" != "${EXPECTED_SOURCE_REPO}" ] || [ "${SOURCE_EVENT}" != "pull_request_review" ] || [ "${SOURCE_ACTION}" != "submitted" ] || [ "${SOURCE_RUN_ID}" != "${EXPECTED_SOURCE_RUN_ID}" ]; then
            echo "FAIL_CLOSED: captured review provenance mismatch"
            exit 1
          fi

          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || ! [[ "${REVIEW_ID}" =~ ^[1-9][0-9]*$ ]] || [ -z "${ACTOR}" ]; then
            echo "FAIL_CLOSED: malformed captured review identity"
            exit 1
          fi

          PR_JSON="$(curl --fail-with-body --silent --show-error \
            --url "https://api.github.com/repos/${SOURCE_REPO}/pulls/${PR_NUMBER}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PUBLIC_GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28")"

          BASE_REPO="$(echo "${PR_JSON}" | jq -r '.base.repo.full_name // empty')"
          HEAD_REPO="$(echo "${PR_JSON}" | jq -r '.head.repo.full_name // empty')"

          if [ "${BASE_REPO}" != "${SOURCE_REPO}" ] || [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" = "${SOURCE_REPO}" ]; then
            echo "FAIL_CLOSED: review relay requires fork-origin pull request"
            exit 1
          fi

          REVIEW_JSON="$(curl --fail-with-body --silent --show-error \
            --url "https://api.github.com/repos/${SOURCE_REPO}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PUBLIC_GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28")"

          AUTHORITATIVE_REVIEWER="$(echo "${REVIEW_JSON}" | jq -r '.user.login // empty')"
          [ "${AUTHORITATIVE_REVIEWER}" = "${ACTOR}" ] || { echo "FAIL_CLOSED: captured reviewer identity mismatch"; exit 1; }

          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/softbreak/northstarops-private/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- <<EOF
          {
            "event_type": "northstarops-governance-event",
            "client_payload": {
              "source_repo": "${SOURCE_REPO}",
              "source_event": "${SOURCE_EVENT}",
              "source_action": "${SOURCE_ACTION}",
              "issue_number": "",
              "pr_number": "${PR_NUMBER}",
              "comment_id": "",
              "review_id": "${REVIEW_ID}",
              "actor": "${ACTOR}"
            }
          }
          EOF
