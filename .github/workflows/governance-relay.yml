name: Governance Relay

on:
  issues:
    types:
      - opened

  issue_comment:
    types:
      - created

  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - ready_for_review
      - synchronize
      - closed

  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  issues: read

jobs:
  relay-publish:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest

    concurrency:
      group: relay-${{ github.repository }}-publish-${{ github.event.issue.number }}
      queue: max

    steps:
      - name: Dispatch publish event to private governance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/softbreak/northstarops-private/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- <<EOF
          {
            "event_type": "northstarops-publish-event",
            "client_payload": {
              "source_repo": "${SOURCE_REPO}",
              "source_event": "issues",
              "issue_number": "${ISSUE_NUMBER}",
              "actor": "${ACTOR}"
            }
          }
          EOF

  relay-claim:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/claim'

    runs-on: ubuntu-latest

    concurrency:
      group: relay-${{ github.repository }}-claim-issue-${{ github.event.issue.number }}
      queue: max

    steps:
      - name: Dispatch claim event to private governance
        if: >-
          github.event.issue.state == 'open' &&
          github.event.issue.assignee == null &&
          contains(github.event.issue.labels.*.name, 'status: available')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ACTOR: ${{ github.actor }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/softbreak/northstarops-private/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- <<EOF
          {
            "event_type": "northstarops-claim-event",
            "client_payload": {
              "source_repo": "${SOURCE_REPO}",
              "source_event": "issue_comment",
              "issue_number": "${ISSUE_NUMBER}",
              "comment_id": "${COMMENT_ID}",
              "actor": "${ACTOR}"
            }
          }
          EOF

  relay-pr-admission:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      !(
        github.event.action == 'synchronize' &&
        github.event.pull_request.draft == true
      )

    runs-on: ubuntu-latest

    concurrency:
      group: relay-${{ github.repository }}-pr-admission-${{ github.event.pull_request.number }}
      queue: max

    steps:
      - name: Dispatch PR governance event to private governance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          case "${SOURCE_ACTION}" in
            ready_for_review|synchronize)
              EVENT_TYPE='northstarops-ai-review-event'
              ;;
            opened|reopened|edited|closed)
              EVENT_TYPE='northstarops-governance-event'
              ;;
            *)
              echo "FAIL_CLOSED: unsupported pull_request_target action '${SOURCE_ACTION}'"
              exit 1
              ;;
          esac

          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/softbreak/northstarops-private/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- <<EOF
          {
            "event_type": "${EVENT_TYPE}",
            "client_payload": {
              "source_repo": "${SOURCE_REPO}",
              "source_event": "pull_request_target",
              "source_action": "${SOURCE_ACTION}",
              "pr_number": "${PR_NUMBER}",
              "actor": "${ACTOR}"
            }
          }
          EOF

  capture-review:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ubuntu-latest

    concurrency:
      group: review-capture-${{ github.repository }}-${{ github.event.review.id }}
      queue: max

    steps:
      - name: Capture review event without secrets
        shell: bash
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          ACTOR: ${{ github.actor }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "${SOURCE_EVENT}" != "pull_request_review" ] || [ "${SOURCE_ACTION}" != "submitted" ]; then
            echo "FAIL_CLOSED: unexpected review capture event"
            exit 1
          fi

          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || ! [[ "${REVIEW_ID}" =~ ^[1-9][0-9]*$ ]] || ! [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || [ -z "${ACTOR}" ]; then
            echo "FAIL_CLOSED: malformed review capture payload"
            exit 1
          fi

          jq -n \
            --arg source_repo "${SOURCE_REPO}" \
            --arg source_event "${SOURCE_EVENT}" \
            --arg source_action "${SOURCE_ACTION}" \
            --arg pr_number "${PR_NUMBER}" \
            --arg review_id "${REVIEW_ID}" \
            --arg actor "${ACTOR}" \
            --arg source_run_id "${SOURCE_RUN_ID}" \
            '{source_repo:$source_repo,source_event:$source_event,source_action:$source_action,pr_number:$pr_number,review_id:$review_id,actor:$actor,source_run_id:$source_run_id}' \
            > review-payload.json

      - name: Upload review relay payload
        uses: actions/upload-artifact@v4
        with:
          name: governance-review-payload
          path: review-payload.json
          if-no-files-found: error
          retention-days: 1
