name: Governance Relay

on:
  issues:
    types:
      - opened

  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read

jobs:
  relay-publish:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest

    concurrency:
      group: relay-${{ github.repository }}-publish-${{ github.event.issue.number }}
      queue: max

    steps:
      - name: Dispatch publish event to private governance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/softbreak/northstarops-private/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- <<EOF
          {
            "event_type": "northstarops-publish-event",
            "client_payload": {
              "source_repo": "${SOURCE_REPO}",
              "source_event": "issues",
              "issue_number": "${ISSUE_NUMBER}",
              "actor": "${ACTOR}"
            }
          }
          EOF

  relay-claim:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/claim'

    runs-on: ubuntu-latest

    concurrency:
      group: relay-${{ github.repository }}-claim-issue-${{ github.event.issue.number }}
      queue: max

    steps:
      - name: Dispatch claim event to private governance
        if: >-
          github.event.issue.state == 'open' &&
          github.event.issue.assignee == null &&
          contains(github.event.issue.labels.*.name, 'status: available')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ACTOR: ${{ github.actor }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/softbreak/northstarops-private/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @- <<EOF
          {
            "event_type": "northstarops-claim-event",
            "client_payload": {
              "source_repo": "${SOURCE_REPO}",
              "source_event": "issue_comment",
              "issue_number": "${ISSUE_NUMBER}",
              "comment_id": "${COMMENT_ID}",
              "actor": "${ACTOR}"
            }
          }
          EOF
